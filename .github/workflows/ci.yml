# Pre-merge CI — every push/PR runs the full non-frozen matrix plus a real
# `wxt build` + store zip of the extension, so "it builds and packages" is
# verified before merge, not discovered at release time. The frozen advanced
# layer stays on its nightly job (monorepo spec §13); the live browser checks
# stay on live-smoke.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck, boundaries)
        run: pnpm run check

      - name: Verify codegen output is up to date
        run: |
          pnpm run codegen
          git diff --exit-code -- packages/contracts/generated || \
            (echo "::error::generated contracts output is out of date; run 'pnpm run codegen' and commit the result" && exit 1)

      - name: Unit tests
        run: pnpm run test

      - name: Build packages
        run: pnpm run build

      - name: Build extension bundle (wxt)
        run: pnpm --filter @gotomemory/extension run build:ext

      - name: Package store zip
        run: pnpm --filter @gotomemory/extension run zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: apps/extension/.output/*.zip
          if-no-files-found: error

      - name: Install Playwright Chromium (extension e2e)
        run: pnpm --filter @gotomemory/extension-e2e exec playwright install chromium --with-deps

      - name: Extension E2E tests
        run: pnpm --filter @gotomemory/extension-e2e run e2e
