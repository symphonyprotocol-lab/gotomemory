# config.gotomemory.dev — serves the signed selector-override document the
# extension fetches (apps/extension/src/selector-config.ts), and nothing else.
#
# The file is NOT baked into an image: it is re-signed independently of any site
# release, so it lives in a host directory mounted read-only here. A missing file
# is a 404, which the extension treats as "keep the built-in selectors".

server {
    listen 80;
    server_name _;

    root /srv/config;

    location = /selector-overrides.v1.json {
        default_type application/json;

        # The extension's MV3 background fetch is cross-origin, so without this
        # header the response is unreadable. The document is public and signed,
        # and the request carries no credentials, so `*` gives away nothing.
        add_header Access-Control-Allow-Origin "*" always;

        # Short enough that a selector hot-fix lands within minutes, long enough
        # that the extension's own 6-hour interval does the real rate limiting.
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The root answers 200 purely so that "is this endpoint alive?" is a question
    # you can answer by opening the hostname. Without it the only published path
    # is the document above, everything else 404s, and a healthy vhost is
    # indistinguishable from a broken one in a browser — which is exactly how it
    # got reported as down.
    location = / {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 200 '{"service":"gotomemory-selector-config","status":"ok"}';
    }

    # Nothing else is published here — no directory listings, no other paths.
    location / {
        return 404;
    }
}
