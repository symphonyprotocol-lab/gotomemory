# Host-level nginx vhosts for GotoMemory. This file is NOT used by the
# containers — it belongs to the nginx already running on the server, and is
# kept here so the proxy config is reviewed and versioned like everything else.
#
# Install:
#   sudo cp deploy/nginx-host/gotomemory.conf /etc/nginx/conf.d/gotomemory.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTP only, as requested — no TLS here yet. Two consequences worth knowing:
# a browser reaching the site over plain HTTP gets no transport security, and
# the Chrome Web Store expects an https:// privacy-policy URL, so this wants a
# certificate before the store listing goes in. When you add TLS, keep the
# X-Forwarded-Proto header below: it is already correct via $scheme, so the
# upstream starts reporting https the moment this block listens on 443.

# ---------------------------------------------------------------- gotomemory.dev
server {
    listen 80;
    listen [::]:80;
    server_name gotomemory.dev www.gotomemory.dev;

    access_log /var/log/nginx/gotomemory.access.log;
    error_log /var/log/nginx/gotomemory.error.log;

    location / {
        proxy_pass http://127.0.0.1:9280;

        # Keepalive to the upstream; without http_version 1.1 every proxied
        # request opens a fresh connection.
        proxy_http_version 1.1;

        # $host, not $proxy_host: the container's nginx must see the public
        # hostname, or any redirect or log line it emits refers to 127.0.0.1.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# --------------------------------------------------------- config.gotomemory.dev
# Serves the signed selector document the extension fetches. The CORS header
# comes from the container (deploy/config-endpoint.nginx.conf) — do not add
# another one here, or responses carry two Access-Control-Allow-Origin values
# and browsers reject them outright.
server {
    listen 80;
    listen [::]:80;
    server_name config.gotomemory.dev;

    access_log /var/log/nginx/gotomemory-config.access.log;
    error_log /var/log/nginx/gotomemory-config.error.log;

    location / {
        proxy_pass http://127.0.0.1:9281;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
