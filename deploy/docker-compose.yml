# Production stack for gotomemory.dev, driven by .github/workflows/deploy.yml.
#
# Both services bind to 127.0.0.1 only: the host's existing reverse proxy
# terminates TLS and forwards to them, so neither container is reachable from
# the internet directly.
#
# WEB_IMAGE is written into .env by the deploy job, pinned to the commit SHA —
# never a floating tag, so `docker compose up` on the server can only ever start
# the build that was verified for that commit, and a rollback is a one-line edit.

name: gotomemory

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set — the deploy job writes it to .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-9280}:80"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  config:
    # Plain upstream nginx: the payload is a mounted file, so there is nothing
    # project-specific to build or push for this endpoint.
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONFIG_PORT:-9281}:80"
    volumes:
      - ./config-endpoint.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./selector-config:/srv/config:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
