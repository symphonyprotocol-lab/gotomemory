# Static hosting for gotomemory.dev. TLS and the public port belong to the
# reverse proxy already running on the host; this server only ever listens on
# plain HTTP inside the container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /privacy (no trailing slash) gets a 301 to /privacy/. By default nginx
    # builds that Location from its own host and port, which behind a reverse
    # proxy means redirecting the visitor to an internal address — verified
    # locally: it emitted `http://127.0.0.1/privacy/`, dropping the port. A
    # relative Location leaves the public scheme, host and port intact.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # nginx's add_header REPLACES inherited headers rather than merging, so the
    # security headers have to be repeated in every location that sets one of
    # its own. Hence the duplication below instead of a server-level block.

    # Vite fingerprints these filenames, so a stale copy can never be wrong.
    location ~* \.(?:css|js|woff2?|ttf|png|jpg|svg|ico)$ {
        # One explicit header rather than `expires 1y` plus an add_header, which
        # emits two Cache-Control lines and leaves clients to reconcile them.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # HTML is never cached: otherwise a deploy stays invisible until browsers
    # decide to revalidate. `try_files` ends at /index.html because routes.ts
    # resolves every unknown path to the homepage rather than a 404 — /privacy/
    # is a real directory and is served from its own index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
